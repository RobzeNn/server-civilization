version: "3.9"

services:
  postgres:
    image: postgres:17-alpine
    container_name: server-civilization-postgres
    environment:
      POSTGRES_USER: server_civilization
      POSTGRES_PASSWORD: server_civilization
      POSTGRES_DB: server_civilization
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U server_civilization -d server_civilization"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
